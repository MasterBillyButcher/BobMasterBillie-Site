<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Console: BobMasterBillie</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="console-shell">
  <aside class="console-rail">
    <div class="console-rail-brand">
      BobMasterBillie
      <span>Manager console</span>
    </div>
    <nav class="console-tabs" id="console-tabs">
      <button class="console-tab is-active" data-tab="overview">Overview</button>
      <button class="console-tab" data-tab="modlog">Moderation log</button>
      <button class="console-tab" data-tab="discord">Discord</button>
      <button class="console-tab" data-tab="veto">Veto &amp; VIP</button>
      <button class="console-tab" data-tab="backlog">Backlog</button>
      <button class="console-tab" data-tab="schedule">Schedule</button>
      <button class="console-tab" data-tab="billing">Billing</button>
      <button class="console-tab" data-tab="clients">Clients</button>
      <button class="console-tab" data-tab="reference">Reference</button>
    </nav>
    <button class="console-signout" id="sign-out">Sign out</button>
  </aside>

  <main class="console-main">
    <div class="client-switcher" id="client-switcher-row">
      <select id="client-select"></select>
      <div class="client-meta" id="client-meta"></div>
    </div>

    <div id="load-error" class="login-error" hidden></div>
    <div id="loading" class="card">Loading...</div>

    <div id="tab-overview" class="tab-panel" hidden></div>
    <div id="tab-modlog" class="tab-panel" hidden></div>
    <div id="tab-discord" class="tab-panel" hidden></div>
    <div id="tab-veto" class="tab-panel" hidden></div>
    <div id="tab-backlog" class="tab-panel" hidden></div>
    <div id="tab-schedule" class="tab-panel" hidden></div>
    <div id="tab-billing" class="tab-panel" hidden></div>
    <div id="tab-clients" class="tab-panel" hidden></div>
    <div id="tab-reference" class="tab-panel" hidden></div>
  </main>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in: BobMasterBillie console</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <h1>Console sign in</h1>
    <p>Sign in with the account you created in Supabase to manage clients.</p>
    <form id="login-form">
      <div id="login-error" class="login-error" hidden></div>
      <label>Email</label>
      <input type="email" id="login-email" autocomplete="username" required>
      <label>Password</label>
      <input type="password" id="login-password" autocomplete="current-password" required>
      <button class="btn btn-primary btn-full" type="submit" id="login-submit">Sign in</button>
    </form>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>

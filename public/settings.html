<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Settings — BobMasterBillie</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <p class="page-eyebrow">Control room</p>
      <h1>Settings</h1>

      <section class="settings-section">
        <h2>Change Password</h2>
        <form id="change-password-form">
          <div class="field">
            <label for="currentPassword">Current password</label>
            <input id="currentPassword" type="password" autocomplete="current-password" required />
          </div>
          <div class="field">
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" autocomplete="new-password" minlength="10" required />
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" required />
          </div>
          <button class="primary" type="submit" id="change-password-submit">Update password</button>
          <p class="error-text hidden" id="change-password-error"></p>
          <p class="success-text hidden" id="change-password-success"></p>
        </form>
      </section>

      <section class="settings-section">
        <h2>Forgot your password?</h2>
        <p>
          Visit <code>/setup.html</code> with your <code>SETUP_SECRET</code>
          to set a new one — no need to know the old one.
        </p>
      </section>

      <section class="settings-section">
        <h2>Session</h2>
        <p>Log out of this browser.</p>
        <button class="secondary" id="logout-btn-settings">Log out</button>
      </section>
    </main>
  </div>
  <script src="/js/csrf.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>

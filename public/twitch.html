<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Twitch — BobMasterBillie</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <p class="page-eyebrow">Control room</p>
      <h1>Twitch</h1>
      <p class="text-dim">Notes on your Twitch setup — stream title ideas, category rotation, panel copy, whatever you need to remember.</p>

      <div class="doc-editor" data-doc-editor data-section="twitch">
        <div class="doc-toolbar">
          <span class="doc-status">Loading…</span>
          <button class="secondary doc-save-btn" type="button">Save</button>
        </div>
        <textarea class="doc-textarea" placeholder="Start typing..." spellcheck="true"></textarea>
      </div>
    </main>
  </div>
  <script src="/js/csrf.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/doc.js"></script>
</body>
</html>

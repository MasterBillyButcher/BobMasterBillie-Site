<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Channels — BobMasterBillie</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <p class="page-eyebrow">Control room</p>
      <h1>Channels</h1>
      <p class="text-dim">Other channels you raid, host, or keep an eye on.</p>

      <div class="doc-editor" data-doc-editor data-section="channels">
        <div class="doc-toolbar">
          <div class="doc-toolbar-left">
            <span class="doc-status">Loading…</span>
            <div class="doc-counters"></div>
          </div>
          <div class="doc-toolbar-actions">
            <button class="primary doc-edit-btn" type="button">Edit</button>
            <button class="secondary doc-revert-btn hidden" type="button">Undo last save</button>
            <button class="secondary doc-download-btn" type="button">Download</button>
            <button class="secondary doc-save-btn hidden" type="button">Save</button>
          </div>
        </div>
        <div class="doc-view"></div>
        <textarea class="doc-textarea hidden" placeholder="Channel name, why, link..." spellcheck="true"></textarea>
      </div>
    </main>
  </div>
  <script src="/js/csrf.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/doc.js"></script>
</body>
</html>

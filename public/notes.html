<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Stream Notes — BobMasterBillie</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <p class="page-eyebrow">Control room</p>
      <h1>Stream Notes</h1>
      <p class="text-dim">Talking points, reminders, and anything to have on hand mid-stream.</p>
      <div
        id="item-mount"
        data-item-list
        data-section="notes"
        data-title-label="Note title"
        data-body-label="Details"
        data-show-url="false"
        data-url-label="URL"
        data-empty-text="No notes yet. Jot something down below."
        data-add-button-text="Add note"
      ></div>
    </main>
  </div>
  <script src="/js/csrf.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/items.js"></script>
</body>
</html>

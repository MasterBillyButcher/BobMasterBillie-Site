<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dashboard — BobMasterBillie</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <p class="page-eyebrow">Control room</p>
      <h1>Dashboard</h1>
      <p class="text-dim">
        Every section is a simple document you can edit and save — click
        through from the sidebar. Last-edited times below.
      </p>

      <div class="overview-toolbar">
        <input
          type="search"
          id="overview-search"
          class="overview-search-input"
          placeholder="Search across all your notes…"
        />
        <button class="secondary" id="export-all-btn">Export all as .txt</button>
      </div>

      <div id="search-results"></div>
      <div class="stat-grid" id="overview-grid"></div>
    </main>
  </div>
  <script src="/js/csrf.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/overview.js"></script>
</body>
</html>

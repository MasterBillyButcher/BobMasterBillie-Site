<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Quick Links — BobMasterBillie</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="mobile-topbar">
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open menu">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h14M3 10h14M3 14h14" stroke-linecap="round"/></svg>
    </button>
    <span class="mobile-brand">BOBMASTERBILLIE</span>
  </header>
  <div class="sidebar-scrim" id="sidebar-scrim"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <p class="page-eyebrow">Control room</p>
      <h1 data-section="links">Quick Links</h1>
      <p class="text-dim">Bookmarks and links you reach for constantly.</p>

      <div class="doc-editor" data-doc-editor data-section="links">
        <div class="doc-toolbar">
          <div class="doc-toolbar-left">
            <span class="doc-status">Loading…</span>
            <div class="doc-counters"></div>
          </div>
          <div class="doc-toolbar-actions">
            <button class="primary doc-edit-btn" type="button">Edit</button>
            <button class="secondary doc-revert-btn hidden" type="button">Undo last save</button>
            <button class="secondary doc-copy-btn" type="button">Copy</button>
            <button class="secondary doc-print-btn" type="button">Print</button>
            <button class="secondary doc-download-btn" type="button">Download</button>
            <button class="secondary doc-save-btn hidden" type="button">Save</button>
          </div>
        </div>
        <div class="doc-view"></div>
        <textarea class="doc-textarea hidden" placeholder="Label -> https://..." spellcheck="true"></textarea>
      </div>
    </main>
  </div>
  <script src="/js/csrf.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/pins.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/shortcuts.js"></script>
  <script src="/js/doc.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Setup — BobMasterBillie</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="center-screen">
    <div class="card">
      <p class="card-eyebrow">BobMasterBillie // Setup</p>
      <h1>Set dashboard password</h1>
      <p class="text-dim">
        Requires your <code>SETUP_SECRET</code>. Works with no prior
        login — this is the bootstrap and recovery path.
      </p>
      <form id="setup-form">
        <div class="field">
          <label for="setupSecret">Setup secret</label>
          <input id="setupSecret" type="password" autocomplete="off" required />
        </div>
        <div class="field">
          <label for="newPassword">New dashboard password</label>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="10" required />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" required />
        </div>
        <button class="primary" type="submit" id="setup-submit">Set password</button>
        <p class="error-text hidden" id="setup-error"></p>
        <p class="success-text hidden" id="setup-success"></p>
      </form>
    </div>
  </div>
  <script src="/js/csrf.js"></script>
  <script src="/js/setup.js"></script>
</body>
</html>

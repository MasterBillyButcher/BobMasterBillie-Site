<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>CV — BobMasterBillie</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <p class="page-eyebrow">Control room</p>
      <h1>CV</h1>
      <p class="text-dim">Bio, credentials, and background info — handy for applications, media kits, or sponsor outreach.</p>
      <div
        id="item-mount"
        data-item-list
        data-section="cv"
        data-title-label="Section title (e.g. Bio, Skills, Experience)"
        data-body-label="Content"
        data-show-url="false"
        data-url-label="URL"
        data-empty-text="Nothing here yet."
        data-add-button-text="Add section"
      ></div>
    </main>
  </div>
  <script src="/js/csrf.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/items.js"></script>
</body>
</html>

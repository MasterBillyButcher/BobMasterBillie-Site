<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Custom Commands — BobMasterBillie</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <p class="page-eyebrow">Control room</p>
      <h1>Custom Commands</h1>
      <p class="text-dim">Chat commands and what they should respond with — for your own reference, or to copy into Nightbot/StreamElements.</p>
      <div
        id="item-mount"
        data-item-list
        data-section="commands"
        data-title-label="Command (e.g. !uptime)"
        data-body-label="Response"
        data-empty-text="No commands yet. Add your first one below."
        data-add-button-text="Add command"
      ></div>
    </main>
  </div>
  <script src="/js/csrf.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/items.js"></script>
</body>
</html>
